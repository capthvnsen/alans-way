name: browser-egress

on:
  pull_request:
    paths: ['scripts/browser_egress.py', 'tests/*browser_egress*', '.github/workflows/browser-egress.yml']
  push:
    branches: [main]
    paths: ['scripts/browser_egress.py', 'tests/*browser_egress*', '.github/workflows/browser-egress.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request cancels its older run. Pushes to main
  # and manual runs get a unique group, so they are never cancelled or replaced
  # while pending.
  group: browser-egress-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kernel-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - run: python3 -m unittest tests.test_browser_egress -v
      - name: Verify filtering in a disposable network namespace
        run: sudo unshare --net python3 tests/browser_egress_kernel.py
