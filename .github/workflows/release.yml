name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Assets upload into a draft, so releases/latest never points at a release
  # whose installers are still building.
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  build:
    needs: [draft]
    if: always() && (needs.draft.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            files: dist/OpenAlan-mac.dmg dist/OpenAlan-mac.dmg.sha512
          - os: windows-latest
            script: package:win
            files: dist/OpenAlan-windows-setup.exe dist/latest.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - if: github.event_name == 'push'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run ${{ matrix.script }}
      - if: runner.os == 'macOS'
        run: shasum -a 512 dist/OpenAlan-mac.dmg | cut -d' ' -f1 > dist/OpenAlan-mac.dmg.sha512
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            desktop/dist/OpenAlan-*
            desktop/dist/latest.yml
      - if: github.event_name == 'push'
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [build]
    # Release candidates (tags with '-') stay drafts: never public, safe for testing.
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
