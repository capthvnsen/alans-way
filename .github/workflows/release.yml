name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      nightly_tag:
        type: string
        default: ''
      nightly_version:
        type: string
        default: ''
      build_ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Assets upload into a draft, so releases/latest never points at a release
  # whose installers are still building. A published release is never
  # re-uploaded into.
  draft:
    if: github.event_name == 'push' || inputs.nightly_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.build_ref || github.sha }}
      - if: inputs.nightly_tag == ''
        run: node desktop/scripts/check-version.cjs "$GITHUB_REF_NAME"
      - if: inputs.nightly_tag != ''
        run: |
          node -e 'const {nightlyBuild}=require("./desktop/src/release-channel.cjs"); const b=nightlyBuild(require("./desktop/package.json").version,new Date(process.env.TAG.slice(8).replace(/(....)(..)(..)/,(_,y,m,d)=>[y,m,d].join("-")))); if(b.tag!==process.env.TAG || b.version!==process.env.VERSION) throw Error("Invalid nightly stamp")'
        env:
          TAG: ${{ inputs.nightly_tag }}
          VERSION: ${{ inputs.nightly_version }}
      - run: |
          draft=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            none)
              if [ -n "$NIGHTLY_VERSION" ]; then
                gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --prerelease --latest=false --title "$NIGHTLY_VERSION" --generate-notes --target "$BUILD_REF"
              else
                gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --generate-notes --verify-tag
              fi ;;
            true)
              if [ -n "$NIGHTLY_VERSION" ]; then
                target=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
                title=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name --jq .name)
                if [ "$target" != "$BUILD_REF" ] || [ "$title" != "$NIGHTLY_VERSION" ]; then
                  echo "::error::Existing nightly draft belongs to another commit/version; leave it intact and wait for tomorrow's nightly"; exit 1
                fi
              fi ;;
            false) echo "::error::$TAG is already published; tag a new version instead"; exit 1 ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.nightly_tag || github.ref_name }}
          NIGHTLY_VERSION: ${{ inputs.nightly_version }}
          BUILD_REF: ${{ inputs.build_ref || github.sha }}

  # Builds run every dependency's install scripts, so they get no write token.
  build:
    needs: [draft]
    if: ${{ !cancelled() && (needs.draft.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.nightly_tag == '')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac
          - os: windows-latest
            script: package:win
          - os: ubuntu-latest
            script: package:linux
            optional: true
    runs-on: ${{ matrix.os }}
    # A Linux build failure must not cancel an in-progress Mac notarization
    # or block the release; macOS/Windows failures still fail the job.
    continue-on-error: ${{ matrix.optional || false }}
    # Apple's first notarizations for a new Developer ID can take well over half an hour.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.build_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # The suite has Mac/Linux-only tests; tests.yml covers the Windows driver.
      - if: runner.os == 'macOS'
        run: npm run check
      - if: github.event_name == 'push' && inputs.nightly_tag == ''
        run: |
          version=$(node scripts/check-version.cjs "$GITHUB_REF_NAME")
          npm version "$version" --no-git-tag-version --allow-same-version
      - if: inputs.nightly_tag != ''
        run: npm version "$NIGHTLY_VERSION" --no-git-tag-version --allow-same-version
        env:
          NIGHTLY_VERSION: ${{ inputs.nightly_version }}
      # macOS signs when the signing secrets exist and stays ad-hoc otherwise,
      # so forks build unchanged. Nightlies reuse the tagged-release signing path.
      - run: npm run ${{ matrix.script }}
        env:
          GITHUB_REF_TYPE: ${{ inputs.nightly_tag != '' && 'tag' || github.ref_type }}
          GITHUB_REF_NAME: ${{ inputs.nightly_tag || github.ref_name }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && (github.event_name == 'push' || inputs.nightly_tag != '') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && (github.event_name == 'push' || inputs.nightly_tag != '') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && (github.event_name == 'push' || inputs.nightly_tag != '') && secrets.APPLE_TEAM_ID || '' }}
      - if: runner.os == 'macOS'
        run: shasum -a 512 dist/OpenAlan-mac.dmg | cut -d' ' -f1 > dist/OpenAlan-mac.dmg.sha512
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/OpenAlan-mac.dmg
            desktop/dist/OpenAlan-mac.dmg.sha512
            desktop/dist/OpenAlan-mac.zip
            desktop/dist/OpenAlan-mac.zip.blockmap
            desktop/dist/OpenAlan-windows-setup.exe
            desktop/dist/OpenAlan-windows-setup.exe.blockmap
            desktop/dist/OpenAlan-linux.AppImage
            desktop/dist/latest.yml
            desktop/dist/latest-mac.yml
            desktop/dist/latest-linux.yml

  upload:
    needs: [build]
    if: github.event_name == 'push' || inputs.nightly_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # macOS/Windows assets are required and fail loudly if missing. The
      # Linux leg is optional, so its files upload only when they exist.
      - run: |
          files=(
            dist/OpenAlan-mac.dmg dist/OpenAlan-mac.dmg.sha512
            dist/OpenAlan-mac.zip dist/OpenAlan-mac.zip.blockmap
            dist/OpenAlan-windows-setup.exe dist/OpenAlan-windows-setup.exe.blockmap
            dist/latest.yml dist/latest-mac.yml
          )
          for f in dist/OpenAlan-linux.AppImage dist/latest-linux.yml; do
            if [ -f "$f" ]; then files+=("$f"); else echo "::warning::$f missing; releasing without it"; fi
          done
          gh release upload "$TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.nightly_tag || github.ref_name }}

  publish:
    needs: [upload]
    # Release candidates (tags with '-') stay drafts: never public, safe for testing.
    if: inputs.nightly_tag != '' || (github.event_name == 'push' && !contains(github.ref_name, '-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: |
          if [ -n "$NIGHTLY_TAG" ]; then
            gh release edit "$NIGHTLY_TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ inputs.nightly_tag }}
