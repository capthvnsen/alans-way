name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    # The release build runs check on macOS, so PRs must too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check

  desktop-electron:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run test:desktop
        timeout-minutes: 3
      - run: npm run test:agent-input
        timeout-minutes: 3
      - run: npm run test:permissions
        timeout-minutes: 3
      - run: npm run test:newtab
        timeout-minutes: 3

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node --check src/win-computer.cjs
      - run: node --test test/win-computer.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows workspace MCP executor tests
        working-directory: .
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_windows_server -v
      - name: Parse the PowerShell install/connect scripts
        working-directory: .
        shell: powershell
        run: |
          $found = $false
          foreach ($f in 'scripts/install-windows.ps1', 'scripts/connect-windows.ps1') {
            $tokens = $null; $fileErrs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$fileErrs)
            foreach ($e in $fileErrs) {
              $found = $true
              Write-Host "$f line $($e.Extent.StartLineNumber) col $($e.Extent.StartColumnNumber): $($e.Message)"
            }
          }
          if ($found) { exit 1 }

  package-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel in a fresh environment
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m venv "$RUNNER_TEMP/companion-venv"
          "$RUNNER_TEMP/companion-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/companion-venv/bin/python" -m pip install 'mcp==2.0.0'
          python -c 'import os; from pathlib import Path; p = Path(os.environ["GITHUB_PATH"]); p.open("a").write(os.environ["RUNNER_TEMP"] + "/companion-venv/bin\n")'
      - name: Exercise installed CLI and real local protocol
        run: python scripts/smoke_installed.py
      - name: Test installed package
        run: python -m unittest discover -s tests -v
      - name: Publication safety checks
        run: python scripts/check_publication.py
