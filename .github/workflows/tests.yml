name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    # The release build runs check on macOS, so PRs must too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check

  desktop-electron:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run test:electron-fixture
        timeout-minutes: 3
      - run: npm run test:telegram-open
        timeout-minutes: 3
      - run: npm run test:cloud-telegram
        timeout-minutes: 3
      - run: npm run test:desktop
        timeout-minutes: 3
      - run: npm run test:agent-input
        timeout-minutes: 3
      - run: npm run test:permissions
        timeout-minutes: 3
      - run: npm run test:newtab
        timeout-minutes: 3
      - run: node test/run-electron.cjs test/onboarding-layout-electron.cjs
        timeout-minutes: 3
      - run: npm run test:pdf-viewer
        timeout-minutes: 3
      - run: npm run test:restore-tabs
        timeout-minutes: 7
      - run: npm run test:needs-human
        timeout-minutes: 3
      - run: npm run test:recorder
        timeout-minutes: 3
      - run: npm run test:auto-takeover
        timeout-minutes: 3
      - run: npm run test:captcha
        timeout-minutes: 3
      - run: npm run test:update-all
        timeout-minutes: 3
      - uses: actions/checkout@v4
        with:
          repository: capthvnsen/alans-way-agents
          # Paired plugin with approval-binding-v1 (PR #122); move to the v0.21.7 tag at release.
          ref: b9dfb89a1acb564b0750c1c800210ca60fbe3bf5
          path: quality-plugin
      - name: Configure headless binding fixtures
        run: |
          echo "ALANS_WAY_AGENTS=$GITHUB_WORKSPACE/quality-plugin" >> "$GITHUB_ENV"
          echo "HERMES_TEST_CHROME=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"
          echo "HERMES_APPROVAL_EVIDENCE=$RUNNER_TEMP/approval-binding" >> "$GITHUB_ENV"
          echo "HERMES_BINDING_EVIDENCE=$RUNNER_TEMP/target-binding" >> "$GITHUB_ENV"
      - run: npm run test:browser-continuation
        timeout-minutes: 3
      - run: npm run test:browser-recovery
        timeout-minutes: 3
      - run: npm run test:connections-drafts
        timeout-minutes: 3
      - run: npm run test:connections-journey
        timeout-minutes: 3
      - run: npm run test:hermes-conversation-electron
        timeout-minutes: 3
      - run: npm run test:hermes-session-wire-electron
        timeout-minutes: 3
      - run: npm run test:home-first-action
        timeout-minutes: 3
      - run: npm run test:plugin-approval-binding-headless
        timeout-minutes: 3
      - run: npm run test:plugin-target-binding-headless
        timeout-minutes: 3
      - run: npm run test:settings-async
        timeout-minutes: 3
      - run: npm run test:settings-navigation
        timeout-minutes: 3
      - run: npm run test:settings-pending-recovery
        timeout-minutes: 3
      - run: npm run test:settings-persistence
        timeout-minutes: 3
      - run: npm run test:shortcut-query
        timeout-minutes: 3
      - run: npm run test:shortcut-round2
        timeout-minutes: 3
      - run: npm run test:state-ordering
        timeout-minutes: 3

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node --check src/win-computer.cjs
      - run: node --test test/win-computer.test.cjs
      - run: node --test test/hermes-update-ps1.test.cjs
      - run: node --test test/vm-update-ps1.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows workspace MCP executor tests
        working-directory: .
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_windows_server -v
      - name: Parse the PowerShell install/connect scripts
        working-directory: .
        shell: powershell
        run: |
          $found = $false
          foreach ($f in 'scripts/install-windows.ps1', 'scripts/connect-windows.ps1', 'desktop/scripts/hermes-update.ps1') {
            $tokens = $null; $fileErrs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$fileErrs)
            foreach ($e in $fileErrs) {
              $found = $true
              Write-Host "$f line $($e.Extent.StartLineNumber) col $($e.Extent.StartColumnNumber): $($e.Message)"
            }
          }
          if ($found) { exit 1 }

  package-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel in a fresh environment
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m venv "$RUNNER_TEMP/companion-venv"
          "$RUNNER_TEMP/companion-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/companion-venv/bin/python" -m pip install 'mcp==2.0.0'
          python -c 'import os; from pathlib import Path; p = Path(os.environ["GITHUB_PATH"]); p.open("a").write(os.environ["RUNNER_TEMP"] + "/companion-venv/bin\n")'
      - name: Exercise installed CLI and real local protocol
        run: python scripts/smoke_installed.py
      - name: Test installed package
        run: python -m unittest discover -s tests -v
      - name: Publication safety checks
        run: python scripts/check_publication.py
