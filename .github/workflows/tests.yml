name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  HERMES_WORKSPACE_REQUIRE_TAILNET: "1"

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request cancels its older run. Pushes to main
  # and manual runs get a unique group, so they are never cancelled or replaced
  # while pending.
  group: tests-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A fast first answer on pull requests: syntax of the whole tree, then only the
  # unit tests the diff reaches (desktop/scripts/check-diff.cjs). It runs next to
  # the full jobs below and never replaces them, so nothing is checked less.
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # HEAD is the merge commit; its first parent is the base tip.
      - run: node scripts/check-diff.cjs HEAD^1 --no-fallback

  # Pull requests that only touch ios/ cannot affect the desktop jobs (nothing
  # under desktop/ reads ios/). Pushes to main, merge queue runs and manual runs
  # always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      # The filter step only runs for pull requests; every other event runs everything.
      desktop: ${{ steps.filter.outputs.desktop || 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        if: github.event_name == 'pull_request'
        run: |
          # HEAD is the merge commit; its first parent is the base tip.
          if files=$(git diff --name-only HEAD^1 HEAD); then
            printf '%s\n' "$files" | python3 scripts/ci_changes.py >> "$GITHUB_OUTPUT"
          else
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # The release build runs check on macOS, so PRs must too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Three balanced slices of the unit tests; keep the 3 below in step.
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    # About twice the measured p95 run (Linux 170 s, macOS 434 s); the default is 6 hours.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 15 || 6 }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check:syntax
        if: matrix.shard == 1
      - run: node scripts/test-shard.cjs ${{ matrix.shard }} 3 | xargs node test/with-tmp.cjs node --test
      - name: Verify credential ownership across OS users
        if: runner.os == 'Linux' && matrix.shard == 1
        run: sudo "$(command -v node)" --test test/bot-auth.test.cjs test/cleanup-workspace-logs.test.cjs

  desktop-electron:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run test:electron-fixture
        timeout-minutes: 3
      - run: npm run test:telegram-open
        timeout-minutes: 3
      - run: npm run test:cloud-telegram
        timeout-minutes: 3
      - run: npm run test:desktop
        timeout-minutes: 3
      - run: npm run test:agent-input
        timeout-minutes: 3
      - run: npm run test:permissions
        timeout-minutes: 3
      - run: npm run test:newtab
        timeout-minutes: 3
      - run: node test/run-electron.cjs test/onboarding-layout-electron.cjs
        timeout-minutes: 3
      - run: node test/run-electron.cjs test/side-caption-electron.cjs
        timeout-minutes: 3
      - run: node test/run-electron.cjs test/footer-status-electron.cjs
        timeout-minutes: 3
      - run: node test/run-electron.cjs test/connect-vps-electron.cjs
        timeout-minutes: 3
      - run: npm run test:pdf-viewer
        timeout-minutes: 3
      - run: npm run test:restore-tabs
        timeout-minutes: 7
      - run: npm run test:needs-human
        timeout-minutes: 3
      - run: npm run test:recorder
        timeout-minutes: 3
      - run: npm run test:auto-takeover
        timeout-minutes: 3
      - run: npm run test:captcha
        timeout-minutes: 3
      - run: npm run test:update-all
        timeout-minutes: 3
      - uses: actions/checkout@v4
        with:
          repository: capthvnsen/alans-way-agents
          # Paired plugin with approval-binding-v1 (PR #122); move to the v0.21.7 tag at release.
          ref: b9dfb89a1acb564b0750c1c800210ca60fbe3bf5
          path: quality-plugin
      - name: Configure headless binding fixtures
        run: |
          echo "ALANS_WAY_AGENTS=$GITHUB_WORKSPACE/quality-plugin" >> "$GITHUB_ENV"
          echo "HERMES_TEST_CHROME=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"
          echo "HERMES_APPROVAL_EVIDENCE=$RUNNER_TEMP/approval-binding" >> "$GITHUB_ENV"
          echo "HERMES_BINDING_EVIDENCE=$RUNNER_TEMP/target-binding" >> "$GITHUB_ENV"
      - run: npm run test:browser-continuation
        timeout-minutes: 3
      - run: npm run test:browser-recovery
        timeout-minutes: 3
      - run: npm run test:connections-drafts
        timeout-minutes: 3
      - run: npm run test:connections-journey
        timeout-minutes: 3
      - run: npm run test:hermes-conversation-electron
        timeout-minutes: 3
      - run: npm run test:hermes-session-wire-electron
        timeout-minutes: 3
      - run: npm run test:home-first-action
        timeout-minutes: 3
      - run: npm run test:plugin-approval-binding-headless
        timeout-minutes: 3
      - run: npm run test:plugin-target-binding-headless
        timeout-minutes: 3
      - run: npm run test:settings-async
        timeout-minutes: 3
      - run: npm run test:settings-navigation
        timeout-minutes: 3
      - run: npm run test:settings-pending-recovery
        timeout-minutes: 3
      - run: npm run test:settings-persistence
        timeout-minutes: 3
      - run: npm run test:shortcut-query
        timeout-minutes: 3
      - run: npm run test:shortcut-round2
        timeout-minutes: 3
      - run: npm run test:state-ordering
        timeout-minutes: 3

  desktop-windows:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node --check src/win-computer.cjs
      - run: node --test test/win-computer.test.cjs
      - run: node --test test/hermes-update-ps1.test.cjs
      - run: node --test test/vm-update-ps1.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows workspace MCP executor tests
        working-directory: .
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_windows_server -v
      - name: Parse the PowerShell install/connect scripts
        working-directory: .
        shell: powershell
        run: |
          $found = $false
          foreach ($f in 'scripts/install-windows.ps1', 'scripts/connect-windows.ps1', 'desktop/scripts/hermes-update.ps1') {
            $tokens = $null; $fileErrs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$fileErrs)
            foreach ($e in $fileErrs) {
              $found = $true
              Write-Host "$f line $($e.Extent.StartLineNumber) col $($e.Extent.StartColumnNumber): $($e.Message)"
            }
          }
          if ($found) { exit 1 }

  package-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    # About twice the measured p95 run (Linux 40 s, macOS 68 s); the default is 6 hours.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 5 || 3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel in a fresh environment
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m venv "$RUNNER_TEMP/companion-venv"
          "$RUNNER_TEMP/companion-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/companion-venv/bin/python" -m pip install 'mcp==2.0.0'
          python -c 'import os; from pathlib import Path; p = Path(os.environ["GITHUB_PATH"]); p.open("a").write(os.environ["RUNNER_TEMP"] + "/companion-venv/bin\n")'
      - name: Exercise installed CLI and real local protocol
        run: python scripts/smoke_installed.py
      - name: Test installed package
        run: python -m unittest discover -s tests -v
      - name: Publication safety checks
        run: python scripts/check_publication.py

  # The one check to require. It fails when any job failed or was cancelled, and
  # accepts a skipped job only where `changes` skipped it on purpose.
  gate:
    if: always()
    needs: [changes, desktop, desktop-electron, desktop-windows, package-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci_gate.py
        env:
          NEEDS: ${{ toJSON(needs) }}
