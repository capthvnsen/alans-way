name: Bug report
description: Something doesn't work the way the docs say it should.
labels: [bug]
body:
  - type: dropdown
    id: products
    attributes:
      label: Affected products
      description: Select all that apply. Maintainers apply the matching product labels; plugin implementation belongs in capthvnsen/alans-way-agents.
      multiple: true
      options:
        - Alan's Workspace (Mac / iOS / VM handoff)
        - Alan's CU MCP (workspace-mcp / Node server)
        - Alan's Plugin for Hermes (agents repo)
        - Alan's Plugin for Grok Bot (agents repo)
        - Shared config / multiple products
        - Unsure / supporting tools
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Don't paste tokens, `connection.json`, machine IPs, Telegram IDs, transcripts or raw logs. For a security problem, use **Report a vulnerability** on the Security tab instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Relevant app/package revision, OS, MCP client and Node version for CU MCP, Hermes version for its plugin, or Grok Bot version for its package. Name local vs VM execution. Redact private details; do not paste raw verification output.
    validations:
      required: true
