name: Feature request
description: Suggest something your agents or you should be able to do.
labels: [enhancement]
body:
  - type: dropdown
    id: products
    attributes:
      label: Affected products
      description: Select all that apply. Maintainers apply the matching product labels; plugin implementation belongs in capthvnsen/alans-way-agents.
      multiple: true
      options:
        - Alan's Workspace (Mac / iOS / VM handoff)
        - Alan's CU MCP (workspace-mcp / Node server)
        - Alan's Plugin for Hermes (agents repo)
        - Alan's Plugin for Grok Bot (agents repo)
        - Shared config / multiple products
        - Unsure / supporting tools
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please leave out credentials, connection files, private addresses, transcripts, and raw logs.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to get done, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: The behavior you want. Sketches and examples welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
