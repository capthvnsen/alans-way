<!doctype html>
<html lang="en" data-voice-api="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#090b10">
  <title>Hermes voice call</title>
  <link rel="stylesheet" href="call.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="call-shell" id="call-shell" data-state="idle">
    <header class="topbar">
      <div class="agent-label"><span class="live-dot" aria-hidden="true"></span><span id="agent-name">Hermes</span></div>
    </header>

    <section class="stage" aria-label="Voice call">
      <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
      <div class="portrait-wrap" id="portrait-wrap">
        <div class="orbit orbit-back"></div><div class="orbit orbit-front"></div>
        <div class="portrait-frame"><img id="portrait" src="assets/hermes.png" alt="Hermes avatar"></div>
        <div class="voice-ring" aria-hidden="true"></div>
      </div>
      <div class="stage-copy">
        <div class="eyebrow" id="state-label">READY WHEN YOU ARE</div>
        <h1 id="state-title">Talk to Hermes</h1>
        <p id="state-detail">Your conversation continues with this agent.</p>
      </div>
    </section>

    <section class="transcript-panel" id="transcript-panel" aria-live="polite" aria-label="Call transcript" hidden>
      <div class="transcript-empty" id="transcript-empty">Your conversation will appear here.</div>
      <ol id="transcript-list"></ol>
    </section>

    <section class="error-panel" id="error-panel" role="alert" hidden>
      <span class="error-mark">!</span><p id="error-text">Could not start the call.</p>
      <button id="retry-button" class="text-button" type="button">Try again</button>
    </section>

    <footer class="controls">
      <div class="utility-row">
        <button class="utility-button" id="echo-button" type="button" aria-pressed="true" title="Echo control enabled">
          <span class="utility-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12-1a6 6 0 0 1 0 8m2.5-10.5a9.5 9.5 0 0 1 0 13"/></svg></span>
          <span>Echo control</span><span class="toggle-indicator"></span>
        </button>
        <button class="icon-button transcript-toggle" id="transcript-toggle" type="button" aria-label="Show transcript" aria-pressed="false" title="Transcript">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14M5 10h14M5 14.5h9M5 19h6"/></svg>
        </button>
        <button class="utility-button computer-button" id="computer-button" type="button" hidden>
          <span class="utility-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></span><span>Computer</span>
        </button>
      </div>
      <div class="primary-controls">
        <button class="round-control mute-button" id="mute-button" type="button" aria-label="Mute microphone" aria-pressed="false" disabled>
          <svg class="mic-on" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0m-7 7v3m-4 0h8"/></svg>
          <svg class="mic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M9 9v3a3 3 0 0 0 5.1 2.1M15 9V6a3 3 0 0 0-5.7-1.3M5 11a7 7 0 0 0 12 4.9M12 18v3m-4 0h8"/></svg>
          <span id="mute-label">Mute</span>
        </button>
        <button class="call-button" id="call-button" type="button">
          <span class="call-button-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-5l-4 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 9h8m-8 4h5"/></svg></span>
          <span id="call-button-label">Start call</span>
        </button>
        <button class="round-control hangup-button" id="hangup-button" type="button" aria-label="End call" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 15.5a2 2 0 0 1-.3-3.3 14.5 14.5 0 0 1 17.8 0 2 2 0 0 1-.3 3.3l-2.5 1.3a2 2 0 0 1-2.5-.5l-1.5-1.8a7 7 0 0 0-3.2 0l-1.5 1.8a2 2 0 0 1-2.5.5l-2.5-1.3Z"/></svg><span>End</span>
        </button>
      </div>
      <div class="microphone-meter" aria-hidden="true"><span></span></div>
      <p class="privacy-note" id="privacy-note">Microphone is off until you start.</p>
    </footer>
  </main>
  <script type="module" src="call.js"></script>
</body>
</html>
